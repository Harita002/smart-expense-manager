<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Smart Expense Manager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #E3F2FD, #BBDEFB);
            color: #1E3A5F;
        }

        .card {
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.08);
            padding: 2rem;
        }

        h2 {
            font-weight: 600;
            color: #27496D;
        }

        .btn-primary {
            background-color: #1565C0;
            border: none;
        }

        .btn-primary:hover {
            background-color: #0D47A1;
        }

        .btn-secondary {
            background-color: #a4b0be;
            border: none;
        }

        .table th, .table td {
            vertical-align: middle;
        }

        .logo {
            height: 50px;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
    </style>
</head>

<body class="container py-5">

<div class="card">
    <div class="header-section">
        <h2> Expense Records</h2>
        <img src="https://cdn-icons-png.flaticon.com/512/3515/3515434.png" alt="Expense Logo" class="logo">
    </div>

    <div class="mb-3">
        <a class="btn btn-primary" th:href="@{/expenses/form}">➕ Add New Transaction</a>
    </div>


    <form action="/expenses/filter" method="get" class="row g-2 mb-4">

        <div class="col-md-4">
            <select name="category" class="form-select">

                <option value="FOOD">Food</option>
                <option value="TRANSPORT">Transport</option>
                <option value="UTILITIES">Utilities</option>
                <option value="ENTERTAINMENT">Entertainment</option>
                <option value="HEALTH">Health</option>
                <option value="OTHER">Other</option>

            </select>
        </div>

        <div class="col-md-2">
            <button type="submit" class="btn btn-primary">
                Filter
            </button>
        </div>

    </form>

    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead class="table-dark text-center">
            <tr>
                <th> Title</th>
                <th> Amount</th>
                <th> Category</th>
                <th> Date</th>
                <th>️ Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="expense : ${expenses}">
                <td th:text="${expense.title}">Title</td>
                <td th:text="${expense.amount}">0.00</td>
                <td th:text="${expense.category}">Category</td>
                <td th:text="${expense.date}">2025-01-01</td>
                <td class="text-center">
                    <a th:href="@{'/expenses/delete/' + ${expense.id}}" class="btn btn-danger btn-sm"> Delete</a>
                    <!-- Optional: Uncomment if edit is added later
                    <a th:href="@{'/expenses/form/' + ${expense.id}}" class="btn btn-warning btn-sm"> Edit</a>
                    -->
                </td>
            </tr>
            </tbody>
            <tr th:if="${#lists.isEmpty(expenses)}">
                <td colspan="5" class="text-center text-muted">
                    No transactions found
                </td>
            </tr>
        </table>
    </div>

    <div class="text-end mt-3">
        <a href="/dashboard" class="btn btn-secondary"> Back to Dashboard</a>
    </div>
</div>

<div class="text-center mt-4 text-muted">
    Smart Expense Manager © 2026
</div>
</body>
</html>
